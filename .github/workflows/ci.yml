name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 locked verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install 3.12.9

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Install locked Playwright browser
        run: uv run --locked playwright install --with-deps chromium

      - name: Run tests
        run: uv run --locked pytest -ra

      - name: Verify checked-in Plan artifacts
        run: |
          uv run --locked python scripts/export_plan_v1_schema.py --check
          uv run --locked python scripts/export_plan_v1_golden.py --check

      - name: Run Ruff lint on the frozen-contract surface
        run: >-
          uv run --locked ruff check
          src/presentation_director_contracts
          scripts/export_plan_v1_schema.py
          scripts/export_plan_v1_golden.py
          tests/test_plan_v1_*.py

      - name: Check Ruff formatting on the frozen-contract surface
        run: >-
          uv run --locked ruff format --check
          src/presentation_director_contracts
          scripts/export_plan_v1_schema.py
          scripts/export_plan_v1_golden.py
          tests/test_plan_v1_*.py

      - name: Run mypy
        run: uv run --locked mypy src/presentation_director_contracts

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts tests skills/deck-builder/scripts

      - name: Check installer syntax
        run: bash -n bootstrap.sh install.sh

      - name: Build locked package artifacts
        run: uv build --no-build-isolation

  contract-compatibility:
    name: Contract compatibility Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.18", "3.11.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install declared Python version
        run: uv python install ${{ matrix.python-version }}

      - name: Install contract test dependencies from lock
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run Plan contract tests
        run: >-
          uv run --locked --python ${{ matrix.python-version }} --extra dev
          pytest -ra tests/test_plan_v1_*.py
